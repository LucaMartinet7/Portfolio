<!doctype html>

    <head>
        <meta charset="UTF-8" />

        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <meta name="color-scheme" content="light dark" />
        <meta name="theme-color" content="#f6f7f6" />
        <!-- Applies the saved or system theme before first paint. Keep in sync
         with src/lib/theme.ts. Allowed by a hash in the CSP (added at build). -->
        <script>
            (function () {
                var dark = false;
                try {
                    var saved = localStorage.getItem("theme");
                    dark =
                        saved === "dark" ||
                        (saved !== "light" &&
                            matchMedia("(prefers-color-scheme: dark)").matches);
                } catch (e) {}
                document.documentElement.classList.toggle("dark", dark);
                document
                    .querySelector('meta[name="theme-color"]')
                    .setAttribute("content", dark ? "#0f1211" : "#f6f7f6");
            })();
        </script>
